name: Repair cover layout

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair cover layout once
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* COVER REPAIR 2026-09 */"

          if marker not in text:
              text = text.replace(
                  "--cream:#fff9ed;",
                  "--cream:#fff9ed;\n  --paper-2:#f3ead9;",
                  1,
              )

              text = text.replace(
                  "  transform-origin:center bottom;\n  border-radius:3px;\n}\n  transition:transform 1.1s cubic-bezier(.18,.8,.2,1),opacity .7s ease;\n}\n\n.opening:after",
                  "  transform-origin:center bottom;\n  border-radius:3px;\n}\n\n.opening:after",
                  1,
              )

              css = '''
/* COVER REPAIR 2026-09 */
@media (min-width:761px){
  .opening .envelope{
    width:96vw!important;
    max-width:1400px!important;
    min-height:92svh!important;
  }
  .opening .envelope-paper{
    width:100%!important;
    min-height:92svh!important;
    padding:18px 34px 24px!important;
    justify-content:center!important;
    gap:8px!important;
  }
  .opening .topline{
    font-size:20px!important;
    margin-bottom:2px!important;
  }
  .opening .open-art{
    width:min(72vw,980px)!important;
    height:min(58vh,620px)!important;
    min-height:430px!important;
    margin:0 auto 2px!important;
  }
  .opening .names{
    font-size:clamp(84px,7vw,124px)!important;
    line-height:.78!important;
  }
  .opening .date{
    margin:6px 0 12px!important;
  }
  .opening .open-btn{
    min-width:285px!important;
  }
}

@media (max-width:760px){
  .opening .open-art{
    width:100%!important;
    height:min(38svh,300px)!important;
  }
}
'''
              text = text.replace("</style>", css + "\n</style>", 1)
              path.write_text(text, encoding="utf-8")

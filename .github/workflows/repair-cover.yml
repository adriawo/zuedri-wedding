name: Repair cover layout

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply cover CSS repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* COVER REPAIR 2026-09 */"

          if marker in text:
              print("Cover repair already present")
              raise SystemExit(0)

          css = '''
/* COVER REPAIR 2026-09 */
@media (min-width:761px){
  .opening .envelope{
    width:96vw!important;
    max-width:1400px!important;
    min-height:92svh!important;
  }
  .opening .envelope-paper{
    width:100%!important;
    min-height:92svh!important;
    padding:18px 34px 24px!important;
    justify-content:center!important;
    gap:8px!important;
  }
  .opening .topline{font-size:20px!important;margin-bottom:2px!important}
  .opening .open-art{
    width:min(72vw,980px)!important;
    height:min(58vh,620px)!important;
    min-height:430px!important;
    margin:0 auto 2px!important;
  }
  .opening .names{font-size:clamp(84px,7vw,124px)!important;line-height:.78!important}
  .opening .date{margin:6px 0 12px!important}
  .opening .open-btn{min-width:285px!important}
}
@media (max-width:760px){
  .opening .open-art{width:100%!important;height:min(38svh,300px)!important}
}
'''

          if "--paper-2:" not in text:
              text = text.replace("--cream:#fff9ed;", "--cream:#fff9ed;\n  --paper-2:#f3ead9;", 1)

          text = text.replace("</style>", css + "\n</style>", 1)
          path.write_text(text, encoding="utf-8")
          print("Cover repair applied")
          PY

      - name: Commit repaired index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Repair cover composition"
            git push
          fi
